    <header class="header">

          <rect x="18" y="5" width="9" height="9" rx="2.5" fill="currentColor" opacity=".55" />

    <section class="category" aria-labelledby="tools-heading">

          <div class="card-art" aria-hidden="true">
            <svg class="tool-illustration" viewBox="0 0 240 168" fill="none">

            </div>

          </div>
        </a>


        <a class="card card--metronome" href="pages/metronome/index.html" aria-labelledby="metronome-title" aria-describedby="metronome-description">
          <div class="card-art" aria-hidden="true">

              <span class="card-open" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M7 17 17 7M7 7h10v10" /></svg></span>
            </div>
            <p id="metronome-description">跟随可视化节拍练习，自定义节奏与音色。</p>
          </div>
        </a>
      </div>

    <section class="category" aria-labelledby="games-heading">
      <div class="section-heading">
        <h2 id="games-heading">游戏</h2>
        <span class="section-rule" aria-hidden="true"></span>
      </div>
      <div class="cards">

          <div class="card-content">
            <div class="card-heading">
