<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="description" content="浏览器里的虚拟钢琴：多种波形、踏板延音、和弦与转位识别。" />
  <title>虚拟钢琴</title>

  <link rel="icon" type="image/x-icon" href="images/favicon.png">
  <link rel="stylesheet" href="piano.css">
</head>

<body>

  <div id="settings-btn" title="设置">
    <img src="images/setting.png" alt="设置">
  </div>

  <div id="settings-panel">
    <div class="settings-content">

      <div class="settings-pages">

        <div class="page main">

          <div>
            <h2>设置</h2>
          </div>

          <div class="setting-item">
            <label for="volume-slider">主音量</label>
            <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="0.5">
          </div>

          <div class="setting-item">
            <label for="base-freq-input">A4 基准频率 (Hz)</label>
            <input type="number" id="base-freq-input" min="400" max="480" value="440">
          </div>

          <div class="setting-item">
            <label for="waveform-select">波形</label>
            <select id="waveform-select">
              <option value="piano" selected>Piano</option>
              <option value="triangle">Triangle</option>
              <option value="sine">Sine</option>
              <option value="square">Square</option>
              <option value="sawtooth">Sawtooth</option>
            </select>
          </div>

          <div class="setting-item">
            <label for="note-name-toggle">显示音名</label>
            <input type="checkbox" id="note-name-toggle" checked>
          </div>

          <div class="setting-item">
            <label for="key-hint-toggle">显示键位</label>
            <input type="checkbox" id="key-hint-toggle" checked>
          </div>

          <div class="setting-item">
            <label for="chord-toggle">识别和弦</label>
            <input type="checkbox" id="chord-toggle" checked>
          </div>

          <div class="sub-setting setting-item" id="inversion-setting">
            <label for="inversion-toggle">允许转位</label>
            <input type="checkbox" id="inversion-toggle" checked>
          </div>

          <div class="setting-item has-sub" data-sub="pedal-settings">
            <label>踏板设置</label>
            <button class="sub-btn" id="pedal-sub-btn" type="button" aria-label="进入踏板设置">
              <span aria-hidden="true">→</span>
            </button>
          </div>

          <div class="setting-item has-sub" data-sub="staff-settings">
            <label>五线谱设置</label>
            <button class="sub-btn" id="staff-sub-btn" type="button" aria-label="进入五线谱设置">
              <span aria-hidden="true">→</span>
            </button>
          </div>

        </div>

        <div class="page sub" id="sub-pedal-settings">
          <div class="sub-header">
            <button class="back-btn" id="pedal-back-btn" type="button" aria-label="返回">
              <span aria-hidden="true">←</span>
            </button>
            <h2>踏板设置</h2>
          </div>

          <div class="setting-item">
            <label for="pedal-toggle">显示踏板</label>
            <input type="checkbox" id="pedal-toggle" checked>
          </div>

          <div class="setting-item">
            <label for="invert-pedal-toggle">踏板反转</label>
            <input type="checkbox" id="invert-pedal-toggle">
          </div>

          <div class="setting-item">
            <label for="toggle-pedal-toggle">踏板切换</label>
            <input type="checkbox" id="toggle-pedal-toggle">
          </div>

        </div>

        <div class="page sub" id="sub-staff-settings">
          <div class="sub-header">
            <button class="back-btn" id="staff-back-btn" type="button" aria-label="返回">
              <span aria-hidden="true">←</span>
            </button>
            <h2>五线谱设置</h2>
          </div>

          <div class="setting-item">
            <label for="staff-toggle">开启五线谱</label>
            <input type="checkbox" id="staff-toggle" checked>
          </div>

          <!-- 总开关关掉时整块变暗（但不消失、不移位），打开时恢复 -->
          <div class="staff-options" id="staff-options">

            <div class="setting-item staff-option" id="clef-setting">
              <label for="clef-select">默认谱号</label>
              <select id="clef-select">
                <option value="treble" selected>高音谱号</option>
                <option value="alto">中音谱号</option>
                <option value="bass">低音谱号</option>
              </select>
            </div>

            <div class="setting-item staff-option">
              <label for="grand-toggle">开启双声部</label>
              <input type="checkbox" id="grand-toggle">
            </div>

          </div>

        </div>
      </div>
    </div>
  </div>

  <!-- 标题与提示 -->
  <div class="info">
    <h1>虚拟钢琴</h1>
    <p class="hint">键盘/鼠标弹奏  Shift+左侧键 / Alt+右侧键 弹黑键  空格延音  拖动连奏</p>
  </div>

  <!-- 五线谱：固定位置（偏左），永远只画一个柱式和弦 -->
  <div class="sheet is-hidden" id="score-sheet"></div>

  <!-- 和弦符号：独立区域（偏右），与谱面互不依赖，标注和符号都居中 -->
  <div class="chord-side is-empty" id="chord-side">
    <span class="chord-label">当前和弦：</span>
    <span id="current-chord"></span>
  </div>

  <!-- 候选和弦（保持原位）+ 当前音 -->
  <div id="current-chord-alt" class="is-hidden"></div>
  <div id="current-note">当前音: -</div>

  <!-- 键盘 -->
  <div class="piano-wrapper" id="piano-wrapper">
    <div class="keybed">
      <div class="felt"></div>
      <div id="piano"></div>
    </div>
  </div>

  <!-- 踏板 -->
  <div class="pedal" id="pedal">
    <span>踏板 (Space)</span>
  </div>

  <script src="js/chords.js"></script>
  <script src="js/synth.js"></script>
  <script src="js/keyboard.js"></script>
  <script src="js/panel.js"></script>
  <script src="js/store.js"></script>
  <script src="js/staff.js"></script>
  <script src="js/main.js"></script>

</body>
</html>
