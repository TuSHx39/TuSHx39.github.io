<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="description" content="溢彩画：把相连的同色色块染成指定颜色，用有限步数让整幅图变成同一种颜色。支持自定义图形、随机出题、分享。" />
  <title>溢彩画</title>

  <link rel="icon" type="image/x-icon" href="../../assets/images/favicon.png">
  <link rel="stylesheet" href="overflow_paint.css">
</head>

<body>

<div class="page">

  <header class="topbar">
    <div class="title-block"><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span><h1>溢彩画</h1></div>
    <a class="back-link" href="../../index.html" aria-label="返回主页" title="返回主页"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 10 9-7 9 7v10H3Z"/><path d="M9 20v-7h6v7"/></svg></a>
  </header>
  <main class="layout">
    <section class="board-panel" aria-label="涂色板">
      <div class="stats">
        <div class="stat"><span class="stat-label">剩余</span><strong class="stat-value" id="stat-left">–</strong></div>
        <div class="stat stat-used"><span class="stat-label">已用</span><strong class="stat-value" id="stat-used">0 / 0</strong></div>
        <div class="stat stat-goal"><span class="stat-label">目标</span><span class="chip-target" id="stat-target"></span></div>
        <div class="stat" id="stat-min-wrap" hidden><span class="stat-label">最短</span><button type="button" class="difficulty" id="stat-minsteps" title="点一下可以停止计算">–</button></div>
      </div>
      <div class="board-stage" id="board-stage">
        <div class="board-wrap" id="board-wrap">
          <div class="board" id="board" role="grid" aria-label="溢彩画棋盘"></div>
          <div class="banner" id="banner" hidden><div class="banner-card"><h2 id="banner-title"></h2><p id="banner-text"></p><div class="banner-actions" id="banner-actions"></div></div></div>
        </div>
        <div class="palette" id="palette" role="group" aria-label="选择涂色颜色"></div>
      </div>
      <div class="slots" id="slots" aria-hidden="true"></div>
      <div class="paint-dock">
        <div class="toolbar" role="group" aria-label="画板操作">
          <button type="button" id="btn-hint" class="tool-button" aria-label="提示" title="提示（H）" data-tooltip="提示"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18h6m-5 3h4M8 14a6 6 0 1 1 8 0c-1 1-1 2-1 2H9s0-1-1-2Z"/><path d="M12 1v1M2 9h1m18 0h1M4 3l2 2m12 0 2-2"/></svg><span class="sr-only">提示</span></button>
          <button type="button" id="btn-answer" class="tool-button" aria-label="看答案" title="看答案" data-tooltip="看答案"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h6a3 3 0 0 1 3 3v14a4 4 0 0 0-4-2H4ZM20 4h-4a3 3 0 0 0-3 3v14a4 4 0 0 1 4-2h3Z"/><path d="M7 8h3m-3 4h3m6-4h1m-1 4h1"/></svg><span class="sr-only">看答案</span></button>
          <button type="button" id="btn-demo-next" class="tool-button" aria-label="下一步" title="下一步" data-tooltip="下一步"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m7 4 10 8-10 8Z"/><path d="M20 4v16"/></svg><span class="sr-only">下一步</span></button>
          <button type="button" id="btn-demo-all" class="tool-button" aria-label="完整演示" title="完整演示" data-tooltip="完整演示"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m8 4 12 8-12 8Z"/></svg><span class="sr-only">完整演示</span></button>
          <button type="button" id="btn-demo-stop" class="tool-button" aria-label="结束演示" title="结束演示" data-tooltip="结束演示"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="5" width="14" height="14" rx="2"/></svg><span class="sr-only">结束演示</span></button>
          <button type="button" id="btn-plus" class="tool-button" aria-label="步数 +1" title="步数 +1" data-tooltip="步数 +1"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v8m-4-4h8"/></svg><span class="sr-only">步数 +1</span></button>
          <button type="button" id="btn-undo" class="tool-button" aria-label="撤销" title="撤销（U）" data-tooltip="撤销"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m8 4-5 5 5 5M3 9h11a6 6 0 0 1 0 12h-3"/></svg><span class="sr-only">撤销</span></button>
          <button type="button" id="btn-restart" class="tool-button" aria-label="重开本题" title="重开本题（R）" data-tooltip="重开本题"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10a9 9 0 1 1 2 8M3 4v6h6"/></svg><span class="sr-only">重开本题</span></button>
          <button type="button" id="btn-new" class="tool-button" aria-label="随机新题" title="随机新题" data-tooltip="随机新题"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 4 18 16m-4 0h4v-4M3 20l6-6m6-6 6-4m-4 0h4v4"/></svg><span class="sr-only">随机新题</span></button>
          <button type="button" id="btn-share" class="tool-button" aria-label="分享" title="分享" data-tooltip="分享"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="5" cy="12" r="3"/><circle cx="18" cy="5" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8 10 7-4m-7 8 7 4"/></svg><span class="sr-only">分享</span></button>
          <button type="button" id="btn-import" class="tool-button" aria-label="导入" title="导入" data-tooltip="导入"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12m-4-4 4 4 4-4M4 15v6h16v-6"/></svg><span class="sr-only">导入</span></button>
          <button type="button" id="btn-options" class="tool-button" aria-label="设置" title="设置" data-tooltip="设置"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m10 2-1 3-2 1-3-1-2 4 2 2v2l-2 2 2 4 3-1 2 1 1 3h4l1-3 2-1 3 1 2-4-2-2v-2l2-2-2-4-3 1-2-1-1-3Z"/><circle cx="12" cy="12" r="3"/></svg><span class="sr-only">设置</span></button>
        </div>
        <div class="demo-controls" id="demo-controls" hidden><p class="tiny" id="demo-progress" role="status">演示：0 / 0</p></div>
      </div>
      <p class="message info" id="message" role="status" aria-live="polite">选一种颜色，点一块区域。</p>
      <details class="play-help"><summary>怎么玩</summary><p>选色后点击相连色块，把画板染成目标色。同色点击不扣步。数字键 1–4 选色，H 提示，U 撤销，R 重开。齿轮中可调整尺寸、自绘图形和计算最短步数。</p><span class="difficulty" id="stat-difficulty">–</span></details>
    </section>
  </main>
</div>

<!-- 设置 -->
<div class="modal" id="options-modal" hidden>
  <div class="modal-card">
    <header class="modal-head">
      <h2>设置</h2>
      <button type="button" class="icon-btn" id="opt-close" aria-label="关闭">×</button>
    </header>

    <div class="modal-body">

      <div class="tabs">
        <button type="button" class="tab active" data-mode="rect">矩形棋盘</button>
        <button type="button" class="tab" data-mode="mask">自绘图形（10×10）</button>
      </div>

      <section class="pane" id="pane-rect">
        <div class="field-row">
          <label class="field">
            <span>列数（1–20）</span>
            <input type="number" id="opt-cols" min="1" max="20" step="1" value="10">
          </label>
          <label class="field">
            <span>行数（1–15）</span>
            <input type="number" id="opt-rows" min="1" max="15" step="1" value="8">
          </label>
        </div>
        <p class="tiny">常用尺寸：10×8、12×10、15×10、20×15 都行，最多 20 列 15 行。</p>
      </section>

      <section class="pane" id="pane-mask" hidden>
        <div class="mask-editor" id="mask-grid" aria-label="10×10 图形绘制区"></div>
        <div class="mask-presets" id="mask-presets"></div>
        <p class="tiny" id="mask-info"></p>
      </section>

      <div class="field-row">
        <label class="field grow">
          <span>步数上限</span>
          <input type="range" id="opt-limit" min="1" max="15" step="1" value="8">
        </label>
        <output class="limit-out" id="opt-limit-out">8 步</output>
      </div>

      <div class="field">
        <span>目标颜色</span>
        <div class="chips" id="opt-target-chips"></div>
      </div>

      <label class="check">
        <input type="checkbox" id="opt-unique">
        <span>优先生成唯一解</span>
      </label>

      <label class="check">
        <input type="checkbox" id="opt-minsteps">
        <span>计算最短步数 · 可边玩边算</span>
      </label>

      <label class="check">
        <input type="checkbox" id="opt-marks">
        <span>色块图形标记</span>
      </label>

    </div>

    <footer class="modal-foot">
      <button type="button" id="opt-cancel">取消</button>
      <button type="button" class="primary" id="opt-apply">按此设置生成新题</button>
    </footer>
  </div>
</div>

<!-- 参考答案 -->
<div class="modal" id="answer-modal" hidden>
  <div class="modal-card">
    <header class="modal-head">
      <h2>参考答案</h2>
      <button type="button" class="icon-btn" id="answer-close" aria-label="关闭">×</button>
    </header>
    <div class="modal-body">
      <p class="tiny" id="answer-summary"></p>
      <p class="tiny" id="answer-empty" hidden>当前局面没有需要再染的色块。</p>
      <ol class="answer-list" id="answer-list"></ol>
    </div>
    <footer class="modal-foot">
      <button type="button" class="primary" id="answer-demo">在棋盘上演示</button>
    </footer>
  </div>
</div>

<!-- 分享 / 导入 -->
<div class="modal" id="code-modal" hidden>
  <div class="modal-card">
    <header class="modal-head">
      <h2 id="code-title">分享题目</h2>
      <button type="button" class="icon-btn" id="code-close" aria-label="关闭">×</button>
    </header>
    <div class="modal-body">
      <p class="tiny" id="code-hint"></p>
      <textarea id="code-text" class="code-text" spellcheck="false" rows="4"></textarea>
      <p class="tiny warn" id="code-error" hidden></p>
    </div>
    <footer class="modal-foot">
      <button type="button" id="code-cancel">关闭</button>
      <button type="button" class="primary" id="code-confirm">复制</button>
    </footer>
  </div>
</div>

<script src="js/core.js"></script>
<script src="js/generator.js"></script>
<script src="js/solver.js"></script>
<script src="js/minsteps.js"></script>
<script src="js/share.js"></script>
<script src="js/store.js"></script>
<script src="js/app.js"></script>

</body>
</html>
